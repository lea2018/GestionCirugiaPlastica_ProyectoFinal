name: Build solution

env:
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

# Este workflow se ejecuta cuando alguien hace push o crea un pull request
# hacia la rama principal. La idea es verificar automáticamente que el proyecto
# sigue compilando y que las pruebas siguen pasando.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and test
    # Usamos un runner Linux de GitHub Actions, que es suficiente para compilar
    # y probar una solución .NET.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      # 1) Descarga el código fuente del repositorio para que el workflow pueda
      # trabajar con los archivos del proyecto.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Instala el SDK de .NET necesario para compilar la solución.
      # El proyecto usa .NET 10, por eso se configura la versión 10.0.x.
      - name: Setup .NET SDK .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3) Restaura todos los paquetes NuGet y dependencias del proyecto antes
      # de compilar. Esto asegura que el entorno ya tenga todo lo necesario.
      - name: Restore dependencies
        # La solución incluye WinForms (net10.0-windows); habilita su targeting
        # desde el runner Ubuntu. Las pruebas usan SQLite en memoria.
        run: dotnet restore GestionCirugiaPlastica.slnx -p:EnableWindowsTargeting=true

      # 4) Instala la herramienta de SonarScanner para .NET. Si el secreto
      # SONAR_TOKEN no existe, esta parte se omite para que el pipeline no falle.
      - name: Install SonarScanner
        if: ${{ env.SONAR_TOKEN != '' }}
        shell: bash
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # 5) Si no hay token de SonarCloud configurado, avisamos al usuario pero
      # el flujo sigue funcionando normalmente.
      - name: SonarCloud analysis skipped
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "Skipping SonarCloud analysis because SONAR_TOKEN is not configured."

      # 6) Inicia la analítica de SonarCloud antes de compilar para que el
      # análisis cubra la solución completa.
      - name: Begin SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet sonarscanner begin \
            /o:"tesisenel" \
            /k:"TesisEnel_UASD_GestionCirugiaPlastica_2026_03" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.host.url="https://sonarcloud.io"

      # 7) Compila la solución en modo Release. El flag --no-restore evita que
      # vuelva a restaurar paquetes ya descargados y acelera la ejecución.
      - name: Build solution
        run: dotnet build GestionCirugiaPlastica.slnx --configuration Release --no-restore -p:EnableWindowsTargeting=true

      # 8) Ejecuta la suite de pruebas del proyecto. Si alguna prueba falla,
      # el workflow marcará el pipeline como fallido.
      # Además, guardamos los resultados en formato TRX para que GitHub pueda
      # mostrarlos de forma amigable en la interfaz.
      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      # 9) Cierra la analítica de SonarCloud para finalizar el análisis y enviar
      # los resultados al proyecto configurado en SonarCloud.
      - name: End SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      # 10) Publica los resultados de pruebas en GitHub como un Check/Status,
      # para que los estudiantes puedan ver en una vista organizada si hubo
      # fallas o éxito en cada ejecución del pipeline.
      - name: Publish test results
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
        if: success() || failure()
        with:
          name: .NET test results
          path: 'TestResults/**/*.trx'
          reporter: dotnet-trx
